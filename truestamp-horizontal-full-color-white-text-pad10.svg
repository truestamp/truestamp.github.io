  <style type="text/css">
    svg {
      --chevron-color: #1459a9;
      --pyramid-start: #2a3990;
      --pyramid-end: #00aeef;
      --text-color: #ffffff;
      --bg-color: transparent;
      --bg-opacity: 0;
    }

    /* Layout visibility */
    .layout-logo-mark,
    .layout-horizontal,
    .layout-stacked,
    .layout-wordmark { display: none; }

    [data-layout="logo-mark"] .layout-logo-mark { display: inline; }
    [data-layout="horizontal"] .layout-horizontal { display: inline; }
    [data-layout="stacked"] .layout-stacked { display: inline; }
    [data-layout="wordmark"] .layout-wordmark { display: inline; }

    /* Color classes */
    .chevron { fill: var(--chevron-color); fill-opacity: 1; fill-rule: nonzero; }
    .accent  { fill: var(--chevron-color); fill-opacity: 1; fill-rule: nonzero; }
    .bar     { fill: var(--chevron-color); fill-opacity: 1; fill-rule: nonzero; }
    .pyramid { stroke: none; }
    .wordmark-true  { fill: var(--text-color); fill-opacity: 1; fill-rule: nonzero; }
    .wordmark-stamp { fill: var(--text-color); fill-opacity: 1; fill-rule: nonzero; }
    .bg-rect { fill: var(--bg-color); opacity: var(--bg-opacity); }

    /* Gradient stop colors */
    .pyr-stop-start { stop-color: var(--pyramid-start); stop-opacity: 1; }
    .pyr-stop-end   { stop-color: var(--pyramid-end);   stop-opacity: 1; }
  </style>

