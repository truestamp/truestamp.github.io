<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Truestamp on GitHub</title>
    <meta name="description" content="Truestamp's public repositories on GitHub." />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0d1117" />
    <link rel="canonical" href="https://truestamp.github.io/" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        background: #0d1117;
        color: #e6edf3;
      }

      main {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        min-height: 100svh;
        justify-content: center;
        align-items: center;
        padding: 2rem;
        text-align: center;
      }

      a {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
        color: inherit;
        text-decoration: none;
        border-radius: 0.25rem;
      }

      a:focus-visible {
        outline: 2px solid #58a6ff;
        outline-offset: 0.5rem;
      }

      img {
        display: block;
        width: min(80vw, 500px);
        height: auto;
      }

      span {
        font-size: 1.25rem;
        text-decoration: underline;
        text-underline-offset: 0.2em;
      }

      a:hover span {
        text-decoration-thickness: 2px;
      }
    </style>
  </head>

  <body>
    <main>
      <a href="https://github.com/truestamp">
        <h1><img src="truestamp-horizontal-full-color-white-text-pad10.svg" alt="Truestamp" width="1160" height="308" /></h1>
        <span>github.com/truestamp</span>
      </a>
    </main>
  </body>
</html>
