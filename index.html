<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Truestamp | GitHub Landing</title>
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: clamp(14px, 1.25vw, 20px);
      }

      main {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        justify-content: center;
        align-items: center;
        padding: 0 2rem;
        text-align: center;
        background: #0d1117;
        color: #e6edf3;
      }

      img {
        width: min(80vw, 500px);
        height: auto;
      }

      p {
        font-size: 1.25rem;
        margin: 1rem 0;
      }

      a {
        color: inherit;
      }
    </style>
  </head>

  <body>
    <main>
      <a href="https://github.com/truestamp" aria-label="Truestamp on GitHub"><img src="truestamp-horizontal-full-color-white-text-pad10.svg" alt="Truestamp" /></a>
      <p><a href="https://github.com/truestamp">github.com/truestamp</a></p>
    </main>
  </body>
</html>
